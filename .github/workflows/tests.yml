name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # The bot runs on Windows (start-bot.bat), where printing a rupee sign is what breaks.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests -v
